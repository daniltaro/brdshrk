<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="../static/css/auth.css">
</head>

<body>
<button id="themeToggle" class="theme-btn">Тема</button>

<div class="glass-container">
    <div class="glass auth-box">

        <h2>Вход в систему</h2>

        <form id="loginForm">
            <input type="text" name="email" placeholder="Логин" required>
            <input type="password" name="password" placeholder="Пароль" required>

            <button class="btn" type="submit" id="loginSubmitBtn">Войти</button>
        </form>

        <div class="bottom-link">
            <a href="register.html" id="toRegister">Создать аккаунт</a>
        </div>

    </div>
</div>

<script src="../static/js/auth.js" defer></script>
<script src="../static/js/theme.js" defer></script>

</body>
</html>

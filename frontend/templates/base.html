<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задачи</title>
    <link rel="stylesheet" href="../static/css/base.css">
</head>

<body>
<button id="themeToggle" class="theme-btn">Тема</button>

<div class="glass-container">
    <div class="glass todo-view">

        <div class="menu">
            <h2>Мои задачи</h2>
            <button class="login-btn" id="logoutBtn">Выйти</button>
        </div>

        <div class="row" id="todo-block">
            <input type="text" id="todo-input" class="input" placeholder="Что нужно сделать?">
            
            <input type="datetime-local" id="deadline-input" class="date-input" aria-label="Срок выполнения">

            <button class="btn" id="addBtn">
                Добавить
            </button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <div class="status" id="status"></div>

    </div>
</div>

<script src="../static/js/base.js" defer></script>
<script src="../static/js/theme.js" defer></script>

</body>
</html>
